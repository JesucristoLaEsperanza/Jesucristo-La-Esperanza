name: Actualizar versículo diario

on:
  schedule:
    - cron: '15 3 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-daily-verse:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar el sitio
        uses: actions/checkout@v4

      - name: Preparar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Consultar YouVersion y guardar el versículo
        run: node scripts/update-daily-verse.mjs
        env:
          YOUVERSION_APP_KEY: ${{ secrets.YOUVERSION_APP_KEY }}

      - name: Publicar el archivo actualizado
        run: |
          if git diff --quiet -- daily-verse.json; then
            echo "El versículo diario ya está actualizado."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add daily-verse.json
          git commit -m "Actualizar versículo diario"
          git push
